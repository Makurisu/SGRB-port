plugins {
    id 'com.android.application'
}

android {
    namespace 'com.makurisu.sgrb'
    compileSdk 34

    defaultConfig {
        applicationId "com.makurisu.sgrb"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    flavorDimensions "abi"
    productFlavors {
        x86_64Only {
            dimension "abi"
            ndk {
                abiFilters 'x86_64'
            }
        }
        arm64Box64 {
            dimension "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        universal {
            dimension "abi"
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c++17 -O3 -flto -fvisibility=hidden -DNDEBUG"
                }
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
