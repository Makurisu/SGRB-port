name: Build & Test Android Port

on:
  push:
    branches: [ "main", "develop", "feature/**", "bugfix/**", "hotfix/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Native Bridge & Architecture Unit Tests
      run: python3 -m unittest discover -s tests -t tests -v

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run JVM Unit Tests & Build ABI Flavors
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x ./gradlew
        ./gradlew testX86_64OnlyDebugUnitTest assembleX86_64OnlyDebug assembleArm64Box64Debug assembleUniversalDebug --stacktrace

    - name: Upload x86_64Only APK (Native x86_64 & ARM64 ndk_translation)
      uses: actions/upload-artifact@v4
      with:
        name: SGRB-Android-x86_64Only-Debug
        path: app/build/outputs/apk/x86_64Only/debug/*.apk
        if-no-files-found: error

    - name: Upload arm64Box64 APK (Dynamic Box64 Bridge)
      uses: actions/upload-artifact@v4
      with:
        name: SGRB-Android-arm64Box64-Debug
        path: app/build/outputs/apk/arm64Box64/debug/*.apk
        if-no-files-found: error

    - name: Upload Universal Dual-ABI APK
      uses: actions/upload-artifact@v4
      with:
        name: SGRB-Android-Universal-Debug
        path: app/build/outputs/apk/universal/debug/*.apk
        if-no-files-found: error
